uncertainty:
  variance: Physical squared prediction error around the fixed mean; log-linear basis
    correction embedded
  intervals: mean +/- q * sqrt(variance); choose q68 or q95 by abs(mean) band
  magnitude_bands_GB: <=0.1; (0.1,1]; (1,10]; >10
  missing_band: Use the All multiplier if a magnitude band has no fitted entry
  sigma_multipliers:
  - subset: All
    n: 4865
    q68: 0.6936152280975872
    q95: 2.1031027850245545
  - subset: Predicted <=0.1
    n: 2239
    q68: 0.6902101848355005
    q95: 2.375257973003409
  - subset: Predicted (0.1,1]
    n: 1202
    q68: 0.6818230715931074
    q95: 1.7869074155018423
  - subset: Predicted (1,10]
    n: 907
    q68: 0.6612364307549106
    q95: 1.859963641965125
  - subset: Predicted >10
    n: 517
    q68: 0.8033071662115454
    q95: 2.114478355555615
  fallback_recommendation: For coupled transport solvers, combine input_warning.json
    with relative uncertainty sqrt(variance) / max(abs(mean), 0.5 GB) >= 0.75 before
    trusting high-extrapolation predictions.
  limits: Empirical development calibration on fresh reference runs; not a formal
    Gaussian density guarantee
