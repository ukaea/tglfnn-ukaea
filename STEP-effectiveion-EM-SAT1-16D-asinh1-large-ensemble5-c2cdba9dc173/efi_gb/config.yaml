schema: tglfnn-ukaea.step-release.v3
version: 5.0.0
flux: efi_gb
reference_mass_unit: deuterium (m_D = 2 m_p; MASS_1=0.0002723, MASS_2=1.25)
architecture: Pre-LayerNorm residual MLP with embedded log10(XNUE)/log10(BETAE) input
  standardization
interface:
  inputs:
  - RLNS_1
  - RLTS_1
  - RLTS_2
  - TAUS_2
  - RMIN_LOC
  - DRMAJDX_LOC
  - Q_LOC
  - SHAT
