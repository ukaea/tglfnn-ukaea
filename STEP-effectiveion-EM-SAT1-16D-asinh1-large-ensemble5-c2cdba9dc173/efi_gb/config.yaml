  - S_KAPPA_LOC
  - DELTA_LOC
  - S_DELTA_LOC
  - ZEFF
  - VEXB_SHEAR
  - BETAE
  input_dtype: float32
  input_shape:
  - batch
  - 16
  input_scaling: Embedded (including log10(max(x, 1e-8)) on XNUE and BETAE); supply
    raw physical quantities
  outputs:
  - mean
  - variance
  output_shape:
  - batch
  - 1
  units:
  - GB
  - GB^2
  mean_floor: 0
  particle_pinch: Signed (unclamped inward pinch preserved)
training:
  row_counts:
    train: 28730550
    valid: 293527
  optimizer: AdamW
  schedule: One-epoch linear warmup; cosine decay to 1% of initial LR
  gradient_clip_norm: 5.0
  loss: Huber plus detached-mean Gaussian NLL on standardized asinh(y / 1.0 GB)
  checkpoint_criterion: Validation Balanced MAE
  stages: Joint mean/variance backbone; post-hoc frozen-mean physical error-power
    calibration
ensemble:
  size: 5
  aggregation: Equal-weight arithmetic mean; law of total variance prior to physical
    calibration
