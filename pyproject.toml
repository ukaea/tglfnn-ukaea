[build-system]
requires = [
  "setuptools>=64",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "tglfnn_ukaea"
version = "0.3.0"
description = "Neural network surrogate of TGLF (weights only)"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0"
license-files = ["LICENSE"]
authors = [{name = "UKAEA"}]

# Only numpy is required for the tglfnn-ukaea weights only package
dependencies = ["numpy>2"]

[project.optional-dependencies]
dev = ["pandas","matplotlib"]
# For regenerating the weights from the ONNX models (scripts/onnx_to_npz.py)
export = ["onnx", "onnxruntime"]

[project.urls]
Homepage = "https://github.com/ukaea/tglfnn-ukaea/"
Repository = "https://github.com/ukaea/tglfnn-ukaea/"

[tool.setuptools.packages.find]
# The weights and reference directories are namespace packages holding only data
include = ["tglfnn_ukaea*"]

[tool.setuptools.package-data]
# Force the packager to include the weights files
tglfnn_ukaea = ["weights/*/*.npz", "reference/*/*.npz"]